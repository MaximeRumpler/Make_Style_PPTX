name: release

# Attaches the skill as a zip to a GitHub release, for Claude.ai and Claude desktop ("Skills > Upload skill").
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)attach the zip to, e.g. v0.2.0"
        required: true

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Skill zip
        run: |
          mkdir -p dist
          (cd skills && zip -rq ../dist/make-style-pptx.zip make-style-pptx -x '*__pycache__*')
          unzip -l dist/make-style-pptx.zip | grep -q "make-style-pptx/SKILL.md"
      - run: gh release upload "$TAG" dist/* --clobber
