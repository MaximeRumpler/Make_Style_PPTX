<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">Make_Style_PPTX</title>
  <desc id="d">The same clean deck in another style: new shapes, arrangements and backgrounds, same content.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C2333"/>
      <stop offset="1" stop-color="#121826"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity=".18"/>
    </filter>
    <clipPath id="front"><rect x="0" y="72" width="300" height="170" rx="10"/></clipPath>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect x="48" y="48" width="6" height="64" rx="3" fill="url(#acc)"/>

  <text x="72" y="92" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#FFFFFF" letter-spacing="-1">Make_Style_PPTX</text>
  <text x="72" y="140" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#9AA5B8">One clean deck, many styles. Same content, new look.</text>

  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600">
    <rect x="72" y="176" width="150" height="34" rx="17" fill="none" stroke="#10B981" stroke-width="1.5"/>
    <text x="147" y="198" text-anchor="middle" fill="#34D399">AGENT SKILL</text>
    <rect x="236" y="176" width="190" height="34" rx="17" fill="none" stroke="#3B4660" stroke-width="1.5"/>
    <text x="331" y="198" text-anchor="middle" fill="#9AA5B8">STYLES</text>
    <rect x="440" y="176" width="190" height="34" rx="17" fill="none" stroke="#3B4660" stroke-width="1.5"/>
    <text x="535" y="198" text-anchor="middle" fill="#9AA5B8">VARIATIONS</text>
  </g>

  <!-- the same slide in three styles: tech (back), editorial (middle), organic (front) -->
  <g transform="translate(790 46)">
    <rect x="70" y="0" width="300" height="170" rx="10" fill="#0E121B" stroke="#3B4660"/>
    <rect x="94" y="20" width="110" height="10" rx="2" fill="#9AA5B8"/>
    <rect x="270" y="20" width="80" height="44" rx="3" fill="none" stroke="#9AA5B8" stroke-width="1.5"/>

    <rect x="35" y="36" width="300" height="170" rx="10" fill="#EFEAE2" stroke="#3B4660"/>
    <rect x="285" y="36" width="34" height="5" fill="#595959"/>
    <rect x="59" y="56" width="120" height="12" rx="1" fill="#2B2B2B"/>

    <rect x="0" y="72" width="300" height="170" rx="10" fill="#F6F5F1"/>
    <g clip-path="url(#front)">
      <circle cx="292" cy="80" r="46" fill="#D9D9D4"/>
      <circle cx="292" cy="80" r="26" fill="#BDBDB6"/>
    </g>
    <rect x="24" y="96" width="140" height="14" rx="7" fill="#1F1F1F"/>
    <rect x="24" y="122" width="96" height="8" rx="4" fill="#C8C8C2"/>
    <g filter="url(#sh)">
      <rect x="24" y="148" width="76" height="66" rx="12" fill="#FFFFFF"/>
      <rect x="112" y="148" width="76" height="66" rx="12" fill="#FFFFFF"/>
      <rect x="200" y="148" width="76" height="66" rx="12" fill="#FFFFFF"/>
    </g>
    <circle cx="40" cy="166" r="7" fill="#595959"/>
    <circle cx="128" cy="166" r="7" fill="#8C8C8C"/>
    <circle cx="216" cy="166" r="7" fill="#B3B3B3"/>
    <rect x="34" y="182" width="52" height="6" rx="3" fill="#D0D0CC"/>
    <rect x="122" y="182" width="52" height="6" rx="3" fill="#D0D0CC"/>
    <rect x="210" y="182" width="52" height="6" rx="3" fill="#D0D0CC"/>
  </g>
</svg>
